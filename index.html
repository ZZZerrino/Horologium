<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="The personal website of [YOUR NAME]."
  >

  <title>[YOUR NAME] | Personal Website</title>

  <!-- Connects index.html to style.css -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <!-- FIRST FULL-SCREEN SECTION -->
    <section
      class="hero"
      id="home"
      aria-labelledby="hero-title"
    >

      <div class="hero__content">

        <!-- Profile and introduction area -->
        <div class="hero__introduction">

          <!-- Profile area on the left -->
          <header class="profile">

            <img
              class="profile__image"
              src="images/profile.jpg"
              alt="Profile picture of [YOUR NAME]"
              width="180"
              height="180"
            >

            <div class="profile__text">

              <p class="profile__eyebrow">
                Welcome to my website
              </p>

              <h1
                class="profile__name"
                id="hero-title"
              >
                [YOUR NAME]
              </h1>

            </div>

          </header>

          <!-- Small introduction box on the right -->
          <aside
            class="glass-box introduction-box"
            aria-label="Personal introduction"
          >
            <p>
              [INTRODUCTION TEXT]
            </p>
          </aside>

        </div>

        <!-- Large rounded box -->
        <article class="glass-box main-content-box">

          <h2>About Me</h2>

          <div class="main-content-box__body">
            <p>
              [MAIN CONTENT]
            </p>
          </div>

        </article>

      </div>

      <!-- Scroll indicator -->
      <a
        class="scroll-indicator"
        href="#second-section"
        aria-label="Scroll to the next section"
      >

        <span class="scroll-indicator__text">
          Scroll
        </span>

        <span
          class="scroll-indicator__mouse"
          aria-hidden="true"
        >
          <span class="scroll-indicator__wheel"></span>
        </span>

      </a>

    </section>


    <!-- SECOND BLANK FULL-SCREEN SECTION -->
    <section
      class="second-section"
      id="second-section"
      aria-labelledby="second-section-title"
    >

      <h2
        class="visually-hidden"
        id="second-section-title"
      >
        Additional content
      </h2>

      <!-- This section is intentionally blank. -->

    </section>

  </main>

</body>
</html>
